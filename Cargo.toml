[workspace]
resolver = "2"
members = [
    "crates/uda-core",
    "crates/uda-platform-linux",
    "crates/uda-platform-windows",
    "crates/uda-ffi",
    "crates/uda-cli",
]

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
log = "0.4"
bitflags = "2"
async-trait = "0.1"