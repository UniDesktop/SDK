[package]
name = "uda-platform-windows"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
uda-core = { path = "../uda-core" }
thiserror.workspace = true
log.workspace = true
async-trait.workspace = true
# The SMTC async completion (`IAsyncOperation::get()`) is driven by a
# current-thread runtime built per call, exactly like the Linux backend builds
# one per MPRIS query. Keeping the trait synchronous avoids parking a runtime
# for the lifetime of the process.
tokio.workspace = true

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    # `RegCreateKeyExW` and the `HKEY` type live behind this feature in the
    # `windows` crate; `RegOpenKeyExW`/`RegSetValueExW` do not, but keeping the
    # whole registry surface behind one feature avoids a split import list.
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "UI_Notifications",
    "Data_Xml_Dom",
    # The media backend (SMTC) needs the WinRT session manager, its session
    # list/property interfaces, and `Foundation` for `TimeSpan`, `Uri` and the
    # `IAsync*` results those calls return.
    "Media_Control",
    "Foundation",
    "Foundation_Collections",
    # The tray backend needs three more modules:
    # * `Win32_UI_Shell` for `Shell_NotifyIconW` and `NOTIFYICONDATAW`.
    # * `Win32_System_LibraryLoader` for `GetModuleHandleW`.
    # * `Win32_Graphics_Gdi` for `CreateDIBSection`/`CreateBitmap`/`DeleteObject`
    #   and for `CreateIconIndirect` + `ICONINFO`, which the `windows` crate
    #   exports from `WindowsAndMessaging` but gates on GDI.
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    # `CoTaskMemFree` releases the string that
    # `GetCurrentProcessExplicitAppUserModelID` hands back; the `windows` crate
    # gates the whole COM allocator surface behind this feature.
    "Win32_System_Com",
]
