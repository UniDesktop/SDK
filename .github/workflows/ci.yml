name: CI

on:
  push:
    branches: [main, master, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ==========================================================================
  # 1. Quality gates that do not need a display server.
  #    Runs on the cheapest runner first so failures are reported fast.
  # ==========================================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Compile check (workspace, all targets)
        run: cargo check --workspace --all-targets --locked

  # ==========================================================================
  # 2. Cross-compilation hygiene (AGENTS.md Principle 3).
  #    Verifies the Linux host can still type-check every Windows crate.
  # ==========================================================================
  cross-check:
    name: Cross-Compile Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Add mingw-w64 linker for the windows-gnu target
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Type-check whole workspace for x86_64-pc-windows-gnu
        run: cargo check --workspace --all-targets --target x86_64-pc-windows-gnu

  # ==========================================================================
  # 3. Linux: unit tests, D-Bus mock fixtures, FFI build and Python example.
  # ==========================================================================
  linux-test:
    name: Linux (Ubuntu) - Tests & FFI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus dbus-x11 python3 python3-pip python3-dbusmock xvfb

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Compile check
        run: cargo check --workspace --all-targets --locked

      - name: Test uda-core
        run: cargo test --locked -p uda-core

      - name: Test uda-platform-linux (isolated D-Bus session)
        run: dbus-run-session -- cargo test --locked -p uda-platform-linux -- --nocapture

      - name: Test uda-ffi (C-ABI)
        run: cargo test --locked -p uda-ffi

      - name: Build FFI shared library
        run: cargo build --locked -p uda-ffi

      - name: Run Python example against the freshly built library
        run: python3 examples/python/demo.py

      - name: Upload FFI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uda-ffi-linux
          path: |
            target/debug/libuda_ffi.so
          if-no-files-found: error
          retention-days: 14

  # ==========================================================================
  # 4. Windows: Win32/WinRT tests, FFI DLL and the Python example.
  #    The Python example needs the DLL path, which differs per profile.
  # ==========================================================================
  windows-test:
    name: Windows (Win32/WinRT) - Tests & FFI
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Compile check
        run: cargo check --workspace --all-targets --locked

      - name: Test uda-core
        run: cargo test --locked -p uda-core

      - name: Test uda-platform-windows
        run: cargo test --locked -p uda-platform-windows

      - name: Test uda-ffi (C-ABI)
        run: cargo test --locked -p uda-ffi

      - name: Build FFI DLL
        run: cargo build --locked -p uda-ffi

      - name: Verify the DLL exports the documented ABI symbols
        shell: bash
        run: python scripts/pe_exports.py target/debug/uda_ffi.dll

      - name: Run Python example against the freshly built DLL
        shell: bash
        env:
          # Forward slashes keep the path unambiguous for `ctypes.CDLL` and for
          # bash; Windows accepts them everywhere in filesystem paths.
          UDA_LIBRARY: ${{ github.workspace }}/target/debug/uda_ffi.dll
        run: python examples/python/demo.py

      - name: Upload FFI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uda-ffi-windows
          path: |
            target/debug/uda_ffi.dll
            target/debug/uda_ffi.pdb
          if-no-files-found: error
          retention-days: 14

  # ==========================================================================
  # 5. Release pipeline. Only runs on an annotated `v*` tag push, so a normal
  #    push or PR never triggers a publish by accident.
  # ==========================================================================
  release:
    name: Release (tag ${{ github.ref_name }})
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, cross-check, linux-test, windows-test]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Add mingw-w64 linker for the windows-gnu target
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Build release shared libraries
        run: |
          cargo build --release --locked -p uda-ffi
          cargo build --release --locked -p uda-ffi --target x86_64-pc-windows-gnu

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Verify exported ABI symbols (Linux)
        run: |
          set -euo pipefail
          count=$(nm -D --defined-only target/release/libuda_ffi.so | grep -cE ' (uda_[a-z_]+)$')
          echo "exported uda_* symbols: $count"
          if [ "$count" -ne 8 ]; then
            echo "expected exactly 8 exported uda_* symbols, found $count"
            exit 1
          fi

      - name: Verify exported ABI symbols (Windows)
        run: python3 scripts/pe_exports.py target/x86_64-pc-windows-gnu/release/uda_ffi.dll

      - name: Package release archives
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp target/release/libuda_ffi.so dist/
          cp include/uda.h dist/
          tar -czf "uda-ffi-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz" -C dist libuda_ffi.so uda.h

          cp target/x86_64-pc-windows-gnu/release/uda_ffi.dll dist/
          cp include/uda.h dist/
          (cd dist && zip -q "../uda-ffi-${{ github.ref_name }}-x86_64-pc-windows-gnu.zip" uda_ffi.dll uda.h)

          sha256sum uda-ffi-*.tar.gz uda-ffi-*.zip > SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            uda-ffi-*.tar.gz
            uda-ffi-*.zip
            SHA256SUMS.txt
          generate_release_notes: true
          draft: false
