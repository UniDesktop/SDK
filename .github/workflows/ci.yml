name: CI

on:
  push:
    branches: [main, master, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ==========================================================================
  # 1. Quality gates that do not need a display server.
  #    Runs on the cheapest runner first so failures are reported fast.
  # ==========================================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Compile check (workspace, all targets)
        run: cargo check --workspace --all-targets --locked

  # ==========================================================================
  # 2. Cross-compilation hygiene (AGENTS.md Principle 3).
  #    Verifies the Linux host can still type-check every Windows crate.
  # ==========================================================================
  cross-check:
    name: Cross-Compile Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Add mingw-w64 linker for the windows-gnu target
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Type-check whole workspace for x86_64-pc-windows-gnu
        run: cargo check --workspace --all-targets --target x86_64-pc-windows-gnu

  # ==========================================================================
  # 3. Linux: unit tests, D-Bus mock fixtures, FFI build and Python example.
  # ==========================================================================
  linux-test:
    name: Linux (Ubuntu) - Tests & FFI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus dbus-x11 python3 python3-pip python3-dbusmock xvfb

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Compile check
        run: cargo check --workspace --all-targets --locked

      - name: Test uda-core
        run: cargo test --locked -p uda-core

      - name: Test uda-platform-linux (isolated D-Bus session)
        run: dbus-run-session -- cargo test --locked -p uda-platform-linux -- --nocapture

      - name: Test uda-ffi (C-ABI)
        run: cargo test --locked -p uda-ffi

      - name: Build FFI shared library
        run: cargo build --locked -p uda-ffi

      - name: Run Python example against the freshly built library
        env:
          # Ubuntu runners are UTF-8 already; setting it explicitly keeps the
          # behaviour identical to the Windows job and catches regressions where
          # a script forgets to install the UTF-8 guard itself.
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        # `01_appearance` is the read-only smoke test: it touches no wallpaper,
        # sends no notification and takes no power action, so it is safe on an
        # unattended runner. The bundled demos were split into `01`…`07` when
        # the examples were modularised; the old single `demo.py` no longer
        # exists.
        run: python3 examples/python/01_appearance.py

      - name: Upload FFI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uda-ffi-linux
          path: |
            target/debug/libuda_ffi.so
          if-no-files-found: error
          retention-days: 14

  # ==========================================================================
  # 4. Windows: Win32/WinRT tests, FFI DLL and the Python example.
  #    The Python example needs the DLL path, which differs per profile.
  # ==========================================================================
  windows-test:
    name: Windows (Win32/WinRT) - Tests & FFI
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Compile check
        run: cargo check --workspace --all-targets --locked

      - name: Test uda-core
        run: cargo test --locked -p uda-core

      - name: Test uda-platform-windows
        run: cargo test --locked -p uda-platform-windows

      - name: Test uda-ffi (C-ABI)
        run: cargo test --locked -p uda-ffi

      - name: Build FFI DLL
        run: cargo build --locked -p uda-ffi

      - name: Verify the DLL exports the documented ABI symbols
        shell: bash
        env:
          # The Windows console defaults to cp1252, which cannot encode CJK text
          # and raises UnicodeEncodeError. The scripts install their own UTF-8
          # guard; these variables force UTF-8 for any child process too.
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        # `include/uda.h` is the single source of truth for the exported surface:
        # every function it declares must be present in the DLL, so a missing
        # `#[no_mangle]` fails the build. Hard-coding a symbol count here instead
        # broke every release once Phase 2 added exports past the stale number.
        run: python scripts/pe_exports.py target/debug/uda_ffi.dll --expect include/uda.h

      - name: Run Python example against the freshly built DLL
        shell: bash
        env:
          # Forward slashes keep the path unambiguous for `ctypes.CDLL` and for
          # bash; Windows accepts them everywhere in filesystem paths.
          UDA_LIBRARY: ${{ github.workspace }}/target/debug/uda_ffi.dll
          # See the note above: keep Python in UTF-8 mode under the cp1252 console.
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        # Same read-only smoke test as the Linux job. The demos were split into
        # `01`…`07` when the examples were modularised; `demo.py` is gone.
        run: python examples/python/01_appearance.py

      - name: Run Python example in English fallback mode
        shell: bash
        env:
          UDA_LIBRARY: ${{ github.workspace }}/target/debug/uda_ffi.dll
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
          # Simulates a non-CJK console: the demo must fall back to English text
          # instead of emitting mojibake or crashing. Guards the language
          # fallback path that shields us if the encoding guard ever regresses.
          UDA_LANG: en
        run: python examples/python/01_appearance.py

      - name: Upload FFI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uda-ffi-windows
          path: |
            target/debug/uda_ffi.dll
            target/debug/uda_ffi.pdb
          if-no-files-found: error
          retention-days: 14

  # ==========================================================================
  # 5. Release pipeline. Only runs on an annotated `v*` tag push, so a normal
  #    push or PR never triggers a publish by accident.
  # ==========================================================================
  release:
    name: Release (tag ${{ github.ref_name }})
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, cross-check, linux-test, windows-test]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Add mingw-w64 linker for the windows-gnu target
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Build release shared libraries
        run: |
          cargo build --release --locked -p uda-ffi
          cargo build --release --locked -p uda-ffi --target x86_64-pc-windows-gnu

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      # `include/uda.h` is the source of truth for the exported surface. Both
      # platforms are checked against it, so the expected symbol set can never
      # drift from what the crate actually declares: a new `#[no_mangle]`
      # export is picked up automatically, and a *missing* one fails the build.
      # Hard-coding a symbol count here instead is what broke the release check
      # once Phase 2 pushed the export list past the stale number.
      - name: Verify exported ABI symbols (Linux)
        run: |
          set -euo pipefail
          # `scripts/header_symbols.py` emits LF-only output; strip any CR as a
          # belt-and-braces measure so a `$`-anchored grep can never be broken
          # by a carriage return when this step is replayed on a Windows host.
          mapfile -t expected_names < <(python3 scripts/header_symbols.py include/uda.h | tr -d '\r')
          expected=${#expected_names[@]}
          if [ "$expected" -eq 0 ]; then
            echo "error: no uda_* declarations found in include/uda.h"
            exit 1
          fi
          count=$(nm -D --defined-only target/release/libuda_ffi.so | grep -cE ' (uda_[a-z_]+)$')
          echo "exported uda_* symbols: $count (header declares: $expected)"
          if [ "$count" -ne "$expected" ]; then
            echo "expected $expected exported uda_* symbols (one per declaration in include/uda.h), found $count"
            nm -D --defined-only target/release/libuda_ffi.so | grep -E ' (uda_[a-z_]+)$' | sort || true
            exit 1
          fi
          # And every header declaration must be a *defined* export, so a symbol
          # that is stripped or renamed is caught even when the count matches.
          for name in "${expected_names[@]}"; do
            if ! nm -D --defined-only target/release/libuda_ffi.so | grep -qE " ${name}$"; then
              echo "missing export: $name"
              exit 1
            fi
          done

      - name: Verify exported ABI symbols (Windows)
        env:
          # Parsing a cross-built PE file must not depend on the console locale;
          # keep Python in UTF-8 mode regardless of the runner's code page.
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        # Same source-of-truth header as the Linux step above: every declared
        # `uda_*` function must be exported by the cross-built DLL.
        run: python3 scripts/pe_exports.py target/x86_64-pc-windows-gnu/release/uda_ffi.dll --expect include/uda.h

      - name: Package release archives
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp target/release/libuda_ffi.so dist/
          cp include/uda.h dist/
          tar -czf "uda-ffi-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz" -C dist libuda_ffi.so uda.h

          cp target/x86_64-pc-windows-gnu/release/uda_ffi.dll dist/
          cp include/uda.h dist/
          (cd dist && zip -q "../uda-ffi-${{ github.ref_name }}-x86_64-pc-windows-gnu.zip" uda_ffi.dll uda.h)

          sha256sum uda-ffi-*.tar.gz uda-ffi-*.zip > SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            uda-ffi-*.tar.gz
            uda-ffi-*.zip
            SHA256SUMS.txt
          generate_release_notes: true
          draft: false
